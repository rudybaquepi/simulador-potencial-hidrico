<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador de Potencial Hídrico Vegetal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#eef4f7;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
color:#2c3e50;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
margin-bottom:20px;
}

.config{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.slider-box{
padding:10px;
}

label{
display:flex;
justify-content:space-between;
font-weight:bold;
margin-bottom:8px;
font-size:18px;
}

.valor-slider{
color:#27ae60;
}

input[type=range]{
width:100%;
height:10px;
cursor:pointer;
}

.resultados{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:20px;
}

.resultado{
background:#f4f7f9;
padding:20px;
border-radius:15px;
text-align:center;
}

.resultado h3{
margin-bottom:10px;
}

.numero{
font-size:42px;
font-weight:bold;
}

.medidor{
margin-top:20px;
}

.linea{
position:relative;
height:12px;
background:#dcdcdc;
border-radius:30px;
margin:25px 0;
}

.indicador{
position:absolute;
top:-9px;
width:30px;
height:30px;
border-radius:50%;
background:#3498db;
transition:.6s;
left:50%;
transform:translateX(-50%);
}

.escala{
display:flex;
justify-content:space-between;
font-weight:bold;
}

.estado{
text-align:center;
padding:20px;
}

.estado h2{
margin-bottom:20px;
font-size:40px;
}

.planta{
font-size:180px;
transition:all .8s ease;
}

.gotas{
position:relative;
height:80px;
overflow:hidden;
}

.gota{
position:absolute;
font-size:35px;
animation:caida 2.5s infinite;
}

.gota:nth-child(2){
animation-delay:.5s;
}

.gota:nth-child(3){
animation-delay:1s;
}

.gota:nth-child(4){
animation-delay:1.5s;
}

@keyframes caida{

0%{
left:-20px;
opacity:0;
}

20%{
opacity:1;
}

100%{
left:250px;
opacity:0;
}

}

.feedback{
margin-top:20px;
padding:20px;
border-radius:15px;
background:#eef7ff;
line-height:1.8;
font-size:17px;
}

.turgente{
background:#eafaf1;
border-left:8px solid #27ae60;
}

.equilibrio{
background:#fff8e7;
border-left:8px solid #f1c40f;
}

.plasmolizada{
background:#fdecea;
border-left:8px solid #e74c3c;
}

@media(max-width:768px){

.config{
grid-template-columns:1fr;
}

.resultados{
grid-template-columns:1fr;
}

.planta{
font-size:120px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>🌿 Simulador de Potencial Hídrico de la Célula Vegetal</h1>

<div class="card">

<div class="config">

<div class="slider-box">

<label>
Potencial Osmótico Ψh
<span id="osmValor" class="valor-slider">-1.0 MPa</span>
</label>

<input
type="range"
id="osm"
min="-3"
max="0"
step="0.1"
value="-1.0"
oninput="calcular()">

</div>

<div class="slider-box">

<label>
Potencial de Presión Ψp
<span id="presionValor" class="valor-slider">0.3 MPa</span>
</label>

<input
type="range"
id="presion"
min="0"
max="2"
step="0.1"
value="0.3"
oninput="calcular()">

</div>

<div class="slider-box">

<label>
Potencial Medio Externo Ψe
<span id="externoValor" class="valor-slider">-0.4 MPa</span>
</label>

<input
type="range"
id="externo"
min="-3"
max="1"
step="0.1"
value="-0.4"
oninput="calcular()">

</div>

</div>

</div>

<div class="card">

<div class="resultados">

<div class="resultado">
<h3>Ψ Célula</h3>
<div id="celulaPotencial" class="numero">0</div>
</div>

<div class="resultado">
<h3>Gradiente</h3>
<div id="gradiente" class="numero">0</div>
</div>

<div class="resultado">
<h3>Flujo</h3>
<div id="flujo" class="numero">↔</div>
</div>

</div>

<div class="medidor">

<div class="escala">
<span>Sale Agua</span>
<span>Equilibrio</span>
<span>Entra Agua</span>
</div>

<div class="linea">
<div id="indicador" class="indicador"></div>
</div>

</div>

<div id="estadoBox" class="estado">

<h2 id="estadoTexto">EQUILIBRIO</h2>

<div id="planta" class="planta">
🌱
</div>

<div class="gotas">
<div class="gota">💧</div>
<div class="gota">💧</div>
<div class="gota">💧</div>
<div class="gota">💧</div>
</div>

</div>

<div id="feedback" class="feedback">

Modifique los potenciales para observar el comportamiento hídrico de la célula vegetal.

</div>

</div>

</div>

<script>

function calcular(){

let osm =
parseFloat(document.getElementById("osm").value);

let presion =
parseFloat(document.getElementById("presion").value);

let externo =
parseFloat(document.getElementById("externo").value);

document.getElementById("osmValor").innerHTML =
osm.toFixed(1)+" MPa";

document.getElementById("presionValor").innerHTML =
presion.toFixed(1)+" MPa";

document.getElementById("externoValor").innerHTML =
externo.toFixed(1)+" MPa";

let psiCelula =
osm + presion;

let gradiente =
externo - psiCelula;

document.getElementById("celulaPotencial").innerHTML =
psiCelula.toFixed(2);

document.getElementById("gradiente").innerHTML =
gradiente.toFixed(2);

let indicador =
document.getElementById("indicador");

let posicion =
50 + (gradiente * 15);

posicion=Math.max(0,Math.min(100,posicion));

indicador.style.left=posicion+"%";

let planta =
document.getElementById("planta");

let estado =
document.getElementById("estadoTexto");

let flujo =
document.getElementById("flujo");

let feedback =
document.getElementById("feedback");

let estadoBox =
document.getElementById("estadoBox");

estadoBox.className="estado";

if(gradiente > 0.05){

planta.innerHTML="🌳";
estado.innerHTML="TURGENTE";
flujo.innerHTML="⬇";

estadoBox.classList.add("turgente");

feedback.innerHTML=
"<b>Turgencia:</b> El potencial hídrico del medio externo es mayor que el de la célula. El agua se mueve por ósmosis hacia el interior celular. La vacuola se expande y aumenta la presión de turgencia, favoreciendo el soporte estructural y el crecimiento de la planta.";

}else if(gradiente < -0.05){

planta.innerHTML="🥀";
estado.innerHTML="PLASMOLIZADA";
flujo.innerHTML="⬆";

estadoBox.classList.add("plasmolizada");

feedback.innerHTML=
"<b>Plasmólisis:</b> El potencial hídrico del medio externo es menor que el de la célula. El agua sale de la célula siguiendo la gradiente de potencial hídrico. Disminuye la turgencia y puede producirse separación de la membrana plasmática respecto a la pared celular.";

}else{

planta.innerHTML="🌱";
estado.innerHTML="EQUILIBRIO";
flujo.innerHTML="↔";

estadoBox.classList.add("equilibrio");

feedback.innerHTML=
"<b>Equilibrio hídrico:</b> El potencial hídrico interno y externo son equivalentes. No existe flujo neto de agua, aunque el intercambio molecular continúa dinámicamente.";

}

}

calcular();

</script>

</body>
</html>
